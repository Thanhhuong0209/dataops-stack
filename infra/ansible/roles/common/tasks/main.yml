---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present

- name: Ensure application directory exists
  file:
    path: "{{ app_root | default('/opt/dagster-platform') }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
